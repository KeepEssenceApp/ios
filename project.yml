name: KeepEssence
options:
  bundleIdPrefix: app.keepessence
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 52Z7K6JY2S
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KeepCore:
    path: KeepCore
targets:
  KeepEssence:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: KeepCore
      - target: KeepEssenceShare
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: KeepEssence
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KEKeychainGroup: $(AppIdentifierPrefix)app.keepessence.ios.shared
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBlack
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/KeepEssence.entitlements
      properties:
        com.apple.security.application-groups: [group.app.keepessence.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)app.keepessence.ios.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keepessence.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Allow a local core in debug builds
        script: |
          # http://127.0.0.1:8801 (a core on this Mac) and the test fake. Release builds only speak HTTPS.
          if [ "$CONFIGURATION" = "Debug" ]; then
            P="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P"
          fi
        basedOnDependencyAnalysis: false
  KeepEssenceShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: KeepCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: KeepEssence
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KEKeychainGroup: $(AppIdentifierPrefix)app.keepessence.ios.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/KeepEssenceShare.entitlements
      properties:
        com.apple.security.application-groups: [group.app.keepessence.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)app.keepessence.ios.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keepessence.ios.share
    postBuildScripts:
      - name: Allow a local core in debug builds
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            P="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P"
          fi
        basedOnDependencyAnalysis: false
  KeepEssenceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KeepEssence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.keepessence.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KeepEssence
schemes:
  KeepEssence:
    build:
      targets:
        KeepEssence: all
        KeepEssenceShare: all
        KeepEssenceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeepEssenceUITests
        - package: KeepCore/KeepCoreTests
    archive:
      config: Release
